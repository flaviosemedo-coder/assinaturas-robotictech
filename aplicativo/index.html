<!doctype html>
<html lang="pt-BR"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0d2338">
  <title>Assinatura de e-mail | Robotictech</title>
  <style>
    :root{color-scheme:light;--ink:#10283f;--secondary:#4e6472;--line:#cedeE3;--blue:#124f73;--round:14px}
    *{box-sizing:border-box}
    body{margin:0;background:#f6f8f9;color:var(--ink);font:16px/1.5 Inter,'Avenir Next','Segoe UI',Arial,sans-serif}
    .mast{background:#0d2338;border-bottom:3px solid #2387a7}
    .mast-in,main{width:min(100% - 56px,1100px);margin:auto}
    .mast-in{height:66px;display:flex;align-items:center}
    .brand{display:block;width:158px;height:auto}
    main{padding:clamp(28px,5vw,64px) 0 50px}
    h1,h2,p{margin:0}
    h1{font-size:clamp(30px,3.5vw,44px);line-height:1.12;letter-spacing:-.048em;font-weight:650}
    h2{font-size:19px;letter-spacing:-.025em;font-weight:650;line-height:1.25}
    .lead{margin:10px 0 28px;color:var(--secondary);font-size:16px}
    .layout{display:grid;grid-template-columns:minmax(244px,.74fr) minmax(455px,1.26fr);align-items:start;gap:20px}
    .panel{background:white;border:1px solid #d1dfe5;border-radius:var(--round);padding:24px;min-width:0}
    .fields{display:grid;gap:16px;margin-top:22px}
    .field{display:block;font-size:14px;font-weight:650}
    .optional{font-weight:400;color:#59707b}
    .field input{appearance:none;width:100%;display:block;margin-top:5px;border:1px solid #aabdc8;border-radius:7px;padding:9px 11px;background:white;font:400 16px/1.4 Inter,'Avenir Next','Segoe UI',Arial,sans-serif;color:var(--ink)}
    .field input::placeholder{color:#677e89;opacity:1}
    .photo{border-top:1px solid #dbe5e9;margin-top:22px;padding-top:16px}
    .photo-title{display:block;font-size:14px;font-weight:650;margin-bottom:8px}
    .photo-actions,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button,.photo-action{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:white;border:1px solid #b0c4ce;border-radius:7px;padding:9px 13px;font:600 14px/1.4 Inter,'Avenir Next','Segoe UI',Arial,sans-serif;color:#194961;cursor:pointer}
    button[hidden],.photo-action[hidden]{display:none}
    button:disabled{opacity:.65;cursor:progress}
    #photo{position:absolute;width:1px;height:1px;padding:0;clip-path:inset(50%);overflow:hidden}
    #remove-photo{border:0;text-decoration:underline;text-underline-offset:3px;padding-left:4px;padding-right:4px}
    .preview{overflow:hidden;padding:0}
    .preview h2{padding:22px 24px 17px}
    .surface{display:grid;place-items:center;min-height:217px;padding:28px 20px;background-color:#edf3f5;background-image:radial-gradient(#a8c0c960 .8px,transparent .9px);background-size:12px 12px;border-block:1px solid #dbe5e9}
    #signature{width:100%;max-width:492px;font:14px/1.5 Arial,Helvetica,sans-serif}
    #signature [data-field="name"],#signature [data-field="role"]{overflow-wrap:anywhere}
    .actions{padding:19px 23px 0}
    #copy{background:#124b6c;border-color:#124b6c;color:white}
    #copy:hover{background:#0d3d59}
    #save:hover,.photo-action:hover{background:#f2f7f9}
    :is(a,input,button):focus-visible,#photo:focus-visible+.photo-action{outline:2px solid #15779e;outline-offset:3px}
    .instruction,#status{margin:12px 23px 18px;color:#4e6674;font-size:14px}
    #status:empty{display:none}
    #status:not(:empty)+.instruction{display:none}
    @media(max-width:830px){.layout{grid-template-columns:1fr}.mast-in,main{max-width:640px}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.field:first-child{grid-column:1/-1}.surface{min-height:195px}.lead{margin-bottom:20px}}
    @media(max-width:500px){.mast-in,main{width:calc(100% - 24px)}.mast-in{height:53px}.brand{width:140px}main{padding-top:28px}.layout{gap:15px}.panel{padding:17px}.preview{padding:0}.preview h2{padding:17px}.surface{padding:16px 4px;min-height:160px}.actions{padding:16px 13px 0;gap:8px}.instruction,#status{margin-left:13px;margin-right:13px}.fields{grid-template-columns:1fr;gap:12px}.photo{margin-top:16px}.lead{font-size:15px}}
    @media print{.mast,.heading,#editor,.preview>h2,.actions,#status,.instruction{display:none}main,.layout,.panel,.surface{display:block;margin:0;padding:0;border:0;background:white;width:100%}}
  
@media (max-width:420px) {
  #signature td[bgcolor="#0A203A"] { width:24%!important; padding-left:7px!important; padding-right:7px!important; }
  #signature td[data-part="identity"] { padding-left:8px!important; padding-right:2px!important; }
  #signature td[data-portrait-slot] { width:52px!important; padding-right:7px!important; }
  #signature img[data-portrait] { width:52px!important; height:52px!important; }
  #signature [data-identity-line="name"] { font-size:16px!important; line-height:21px!important; }
  #signature td[width="49"] { width:39px!important; padding-left:2px!important; padding-right:5px!important; }
}
</style>

        <div class="actions">
          <button id="copy" type="submit" form="editor">Copiar assinatura</button>
          <button id="save" type="button">Baixar cópia editável</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <p class="instruction">Depois de copiar, cole no campo de assinatura do Outlook.</p>
      </section>
    </div>
    <noscript>Ative o JavaScript no navegador para personalizar a assinatura.</noscript>
  </main>
  <script id="signature-editor-code">
    'use strict';
    const editor = document.getElementById('editor');
    const signature = document.getElementById('signature');
    const status = document.getElementById('status');
    const fields = Object.fromEntries(['name', 'role', 'phone'].map(key => [key, document.getElementById(key)]));
    const output = key => signature.querySelector('[data-field="' + key + '"]');

    const photoInput = document.getElementById('photo');
    const removePhoto = document.getElementById('remove-photo');
    const portrait = signature.querySelector('[data-portrait]');
    const portraitSlot = portrait.closest('[data-portrait-slot]');
    const photoLabel = document.getElementById('photo-label');
    let photoRequest = 0;
    let photoBusy = false;

    function showPortrait(source) {
      if (source) portrait.setAttribute('src', source);
      else portrait.removeAttribute('src');
      portraitSlot.hidden = !source;
      portraitSlot.style.display = source ? '' : 'none';
      removePhoto.hidden = !source;
      photoLabel.textContent = source ? 'Trocar foto' : 'Adicionar foto';
    }

    function setPhotoBusy(busy) {
      photoBusy = busy;
      document.getElementById('copy').disabled = busy;
      document.getElementById('save').disabled = busy;
    }

    photoInput.addEventListener('change', async () => {
      const file = photoInput.files[0];
      if (!file) return;
      const request = ++photoRequest;
      const url = URL.createObjectURL(file);
      setPhotoBusy(true);
      status.textContent = 'Preparando a foto…';
      try {
        if (!['image/jpeg','image/png','image/webp'].includes(file.type) && !(!file.type && /\.(jpe?g|png|webp)$/i.test(file.name))) {
          throw new Error('Formato de imagem incompatível');
        }
        const image = new Image();
        image.src = url;
        await image.decode();
        if (request !== photoRequest) return;
        const canvas = document.createElement('canvas');
        const size = 160;
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        const side = Math.min(image.naturalWidth, image.naturalHeight);
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(image, (image.naturalWidth - side) / 2, (image.naturalHeight - side) / 2, side, side, 0, 0, size, size);
        showPortrait(canvas.toDataURL('image/png'));
        status.textContent = 'Foto atualizada.';
      } catch {
        if (request === photoRequest) status.textContent = 'Escolha uma imagem em JPG, PNG ou WebP.';
      } finally {
        URL.revokeObjectURL(url);
        if (request === photoRequest) {
          photoInput.value = '';
          setPhotoBusy(false);
        }
      }
    });
    removePhoto.addEventListener('click', () => {
      ++photoRequest;
      photoInput.value = '';
      setPhotoBusy(false);
      showPortrait('');
      status.textContent = 'Foto retirada.';
    });
    showPortrait(portrait.getAttribute('src'));

    function phoneDestination(value) {
      if (!value || !/^[+\d\s().-]+$/.test(value) || value.slice(1).includes('+')) return '';
      let digits = value.replace(/\D/g, '');
      if (value.startsWith('00')) digits = digits.slice(2);
      else if (!value.startsWith('+') && (digits.length === 10 || digits.length === 11)) digits = '55' + digits;
      if (!/^[1-9]\d{6,14}$/.test(digits)) return '';
      return 'tel:+' + digits;
    }

    function update() {
      status.textContent = '';
      for (const key of ['name', 'role']) {
        const value = fields[key].value.trim();
        output(key).textContent = value || (key === 'name' ? 'Seu nome' : 'Cargo ou área');
        fields[key].setCustomValidity(value ? '' : 'Preencha este campo.');
      }
      const phone = fields.phone.value.trim();
      const link = output('phone');
      const uri = phoneDestination(phone);
      link.textContent = phone;
      if (uri) link.setAttribute('href', uri);
      else link.removeAttribute('href');
      link.closest('[data-contact="phone"]').hidden = !phone;
      fields.phone.setCustomValidity(phone && !uri ? 'Confira o número, incluindo o DDD ou o código do país.' : '');
    }

    function clipboardContent() {
      const table = signature.firstElementChild.cloneNode(true);
      table.querySelectorAll('[hidden]').forEach(row => row.remove());
      table.querySelectorAll('[data-field]').forEach(el => el.removeAttribute('data-field'));
      for (const image of table.querySelectorAll('img[data-public]')) {
        image.src = image.dataset.public;
        image.removeAttribute('data-public');
      }
      const plain = [
        output('name').textContent,
        output('role').textContent + ' · Robotictech',
        output('phone').textContent,
        signature.querySelector('a[aria-label="Site da Robotictech"]').href,
        signature.querySelector('a[aria-label="Instagram da Robotictech"]').href,
        signature.querySelector('a[aria-label="YouTube da Robotictech"]').href
      ].filter(Boolean).join('\n');
      return { html: table.outerHTML, plain };
    }

    editor.addEventListener('input', update);
    editor.addEventListener('submit', async event => {
      event.preventDefault();
      if (photoBusy) return;
      update();
      if (!editor.reportValidity()) return;
      const { html, plain } = clipboardContent();
      let copied = false;
      if (navigator.clipboard?.write && window.ClipboardItem) {
        try {
          await navigator.clipboard.write([new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([plain], { type: 'text/plain' })
          })]);
          copied = true;
        } catch { /* Alguns navegadores exigem a cópia por seleção. */ }
      }
      if (!copied) {
        const range = document.createRange();
        const selection = window.getSelection();
        range.selectNodeContents(signature);
        selection.removeAllRanges();
        selection.addRange(range);
        const fillClipboard = event => {
          if (!event.clipboardData) return;
          event.clipboardData.setData('text/html', html);
          event.clipboardData.setData('text/plain', plain);
          event.preventDefault();
        };
        document.addEventListener('copy', fillClipboard);
        try { copied = document.execCommand('copy'); } catch { /* A seleção permite a cópia manual. */ }
        finally { document.removeEventListener('copy', fillClipboard); }
        if (copied) selection.removeAllRanges();
      }
      status.textContent = copied
        ? 'Assinatura copiada. Cole no campo de assinatura do Outlook.'
        : 'Assinatura selecionada. Use Ctrl+C ou ⌘C e cole no Outlook.';
    });

    document.getElementById('save').addEventListener('click', () => {
      update();
      if (!editor.reportValidity()) return;
      const page = document.documentElement.cloneNode(true);
      page.querySelectorAll('iframe, script:not(#signature-editor-code)').forEach(element => element.remove());
      for (const [key, field] of Object.entries(fields)) {
        page.querySelector('#' + key).setAttribute('value', field.value.trim());
      }
      page.querySelector('#status').textContent = '';
      const file = new Blob(['<!doctype html>\n', page.outerHTML], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(file);
      const download = document.createElement('a');
      download.href = url;
      const filename = fields.name.value.trim().replace(/[^\p{L}\p{N} ._-]/gu, '').slice(0, 70).trim();
      download.download = 'Assinatura Robotictech - ' + (filename || 'Equipe') + '.html';
      document.body.appendChild(download);
      download.click();
      download.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      status.textContent = 'Cópia editável gerada com os seus dados.';
    });
    update();
  </script>
